# 릴리즈 이후 2일 이상 된 패키지만 기본적으로 사용
minimumReleaseAge: 2880
# 메인 툴체인에 대해선 적용 제외
# ts-node는 typescript를 require해 JS Compiler API(ts.sys 등)를 쓰는데, 기본 catalog의
# typescript(7.1 네이티브)에는 이 API가 없어 ts-node가 시작하자마자 죽는다.
# ts-node는 typescript를 peer로 받으므로 의존하는 쪽의 typescript가 그대로 쓰인다.
# 기본 catalog를 바꾸면 sonamu의 peer와 create-sonamu 템플릿으로 새어 나가므로,
# ts-node를 devDependency로 쓰는 패키지만 이 catalog로 TS 6를 받는다.
catalogs:
  ts-node-compat:
    typescript: npm:@typescript/typescript6@6.0.2

minimumReleaseAgeExclude:
  - "@optique/*"
  - typescript
  - oxlint*
  - "@oxlint/binding-*"
  - oxfmt
  - oxc*
  - "@oxc-project/*"
  - vite
  - vitest
  - vite*
  - vitest*
  - "@vitejs/*"
  - tsdown
  - rolldown
  - "@typescript/*"

