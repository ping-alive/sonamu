pre-commit:
  commands:
    oxlint:
      glob: "**/*.{js,jsx,ts,tsx,mjs,cjs,cts,mts}"
      run: mise exec -- pnpm exec oxlint --type-aware --fix {staged_files}
      stage_fixed: true
    oxfmt:
      glob: "**/*.{js,jsx,ts,tsx,mjs,cjs,cts,mts,json,jsonc}"
      # .oxfmtrc.json의 ignorePatterns와 동일하게 미러링 — staged 파일이 모두
      # ignore 대상일 때 oxfmt가 빈 입력으로 종료(exit 2)되어 훅이 실패하는 걸 방지
      exclude:
        - ".agent/**"
        - ".agents/**"
        - ".claude/**"
        - ".codex/**"
        - ".continue/**"
        - ".cursor/**"
        - ".gemini/**"
        - ".opencode/**"
        - ".pi/**"
        - ".roo/**"
        - ".windsurf/**"
        - "**/dist/**"
        - "**/build/**"
        - "**/node_modules/**"
        - "examples/**/web/src/services/**"
        - "modules/create-sonamu/template/**"
        - "**/*.gen.ts"
        - "**/*.generated.ts"
        - "**/*.generated.tsx"
      run: mise exec -- pnpm exec oxfmt {staged_files}
      stage_fixed: true
    sonamu-typecheck:
      glob: "modules/sonamu/**/*.{ts,tsx,mts,cts}"
      run: mise exec -- pnpm --filter sonamu test:type
    tasks-typecheck:
      glob: "modules/tasks/**/*.{ts,tsx,mts,cts}"
      run: mise exec -- pnpm --filter @sonamu-kit/tasks check:type
    cdd-typecheck:
      glob: "modules/cdd/**/*.{ts,tsx,mts,cts}"
      run: mise exec -- pnpm --filter @sonamu-kit/cdd check:type
    hmr-hook-typecheck:
      glob: "modules/hmr-hook/**/*.{ts,tsx,mts,cts}"
      run: mise exec -- pnpm --filter @sonamu-kit/hmr-hook typecheck
    hmr-runner-typecheck:
      glob: "modules/hmr-runner/**/*.{ts,tsx,mts,cts}"
      run: mise exec -- pnpm --filter @sonamu-kit/hmr-runner typecheck
    miomock-api-typecheck:
      glob: "examples/miomock/api/**/*.{ts,tsx,mts,cts}"
      run: mise exec -- pnpm --filter miomock-api typecheck
    miomock-web-typecheck:
      glob: "examples/miomock/web/**/*.{ts,tsx,mts,cts}"
      run: mise exec -- pnpm --filter miomock-web typecheck
