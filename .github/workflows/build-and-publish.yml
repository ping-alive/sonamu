name: Build and Publish

on:
  push:
    branches:
      - master
      - stable-v*
  pull_request:
    branches:
      - master

permissions: # 여기를 보세요: https://docs.npmjs.com/trusted-publishers#step-2-configure-your-cicd-workflow
  id-token: write # Required for OIDC
  contents: read
  packages: write # GHCR에 업로드할 때 필요함.

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: deployment

    services:
      # miomock의 PostgreSQL docker compose와 같음
      postgres:
        image: ghcr.io/cartanova-ai/sonamu-postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: miomock123
          # miomock 외 테스트는 postgres에서. miomock은 추후에 스크립트로 데이터베이스를 생성합니다.
          POSTGRES_DB: postgres
          TZ: Asia/Seoul
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          audience: sts.amazonaws.com
          aws-region: ap-northeast-2
          role-to-assume: arn:aws:iam::788833265042:role/GitHubActions

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          cache: true
          install_args: --locked

      - name: Configure npm registry
        shell: bash
        run: |
          npmrc="${RUNNER_TEMP}/npmrc"
          printf '%s\n' \
            'registry=https://registry.npmjs.org/' \
            'always-auth=false' > "${npmrc}"
          echo "NPM_CONFIG_USERCONFIG=${npmrc}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: mise exec -- pnpm install

      # GHCR에 이미지 올리기 위한 준비입니다.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' # PR로 트리거 안 되게 해용
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 빌드와는 별개로 우선 업데이트일 경우에만, ECR Public + GHCR에 이미지를 배포합니다.
      - name: Publish Image
        if: github.event_name == 'push' # PR로 트리거 안 되게 해용
        run: mise run publish:image

      - name: Build
        run: mise run build

      - name: Setup PostgreSQL (Miomock)
        run: |
          # PostgreSQL 클라이언트 설치
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update && sudo apt-get install -y postgresql-client-18
          # init.sql 실행
          PGPASSWORD=miomock123 psql -U postgres -d template1 -h 127.0.0.1 -f examples/miomock/api/database/fixtures/init.sql

      # sonamu.lock 지우고 sync가 잘 되는지 봅니다.
      - name: Miomock sync test
        run: scripts/miomock-sync-test.sh

      # miomock-api와 miomock-web이 제대로 실행되는지 봅니다.
      - name: Miomock smoke test
        run: scripts/miomock-smoke-test.sh

      # miomock-api의 테스트를 실행합니다.
      - name: Miomock unit test
        run: scripts/miomock-unit-test.sh

      # Tasks 관련 통합 테스트를 실행합니다.
      - name: Task Queue integration test
        run: scripts/task-queue-integration-test.sh

      # npm에 퍼블리시합니다.
      # 인증은 trusted publisher로 따로 처리됩니다(https://docs.npmjs.com/trusted-publishers#step-2-configure-your-cicd-workflow).
      - name: Publish
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/stable-v'))
        run: |
          if [ "${GITHUB_REF_NAME}" = "master" ]; then
            export NPM_DIST_TAG=latest
          elif [[ "${GITHUB_REF_NAME}" == stable-v* ]]; then
            export NPM_DIST_TAG="${GITHUB_REF_NAME}"
          else
            echo "Unsupported publish branch: ${GITHUB_REF_NAME}"
            exit 1
          fi

          echo "Publishing npm packages with dist-tag: ${NPM_DIST_TAG}"
          mise run publish:packages
